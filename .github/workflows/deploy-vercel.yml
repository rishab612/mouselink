name: Deploy MouseLink to Vercel

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "public/**"
      - "vercel.json"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouselink-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.MOUSELINK_VERCEL_AUTODEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0
      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publish production deployment
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
